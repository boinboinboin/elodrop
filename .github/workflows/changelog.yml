# Every pull request into main adds its entry to CHANGELOG.md (see CLAUDE.md for the versions)
name: Changelog

on:
  pull_request:
    branches: [main]

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: CHANGELOG.md has a new entry
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qx "CHANGELOG.md"; then
            echo "CHANGELOG.md updated."
          else
            echo "::error file=CHANGELOG.md::Add this change's version and bullets to CHANGELOG.md (see CLAUDE.md)."
            exit 1
          fi
