# Nightly: fetch new results (tournaments and team matches), tournament draws, the player register,
# the clubs and the official ranking; then rebuild only what's needed (fingerprint.mjs):
#   - full: rate, draw luck, export everything, refresh the pages whose data changed. On
#     the Saturday, Sunday and Monday runs (01:15 UTC, after Friday's, Saturday's and Sunday's
#     matches; also "since last week" in the rankings), on manual runs, and whenever results, the
#     ranking, the register or the pipeline itself changed (results registered late, on any day,
#     are picked up the next night; so are the matches played in a tournament still going on, from
#     its draw, until badmintonportalen has its results: cup2000-results.mjs).
#   - draws: only new or changed tournament draws: rate (for the ratings before each tournament),
#     analyse the draws, upload and refresh only the tournament pages.
#   - none: nothing new: no uploads, and the site keeps its cached pages.
# A full rebuild runs the Eliteserien steps (team strengths and the season's forecast, the 10-match test, the seasons
# in review) only when Eliteserien ties or its scripts changed (fingerprint.mjs, "eliteserien"); otherwise their
# files are kept from the last run (raw bucket), so its page isn't refreshed for nothing.
# Every night (any of these) also refreshes what changed in the Studio (clubs, badges, halls, tournaments), and
# everything if the last run's refresh failed.
# Sundays also rescan the whole season's tournament draws.
#
# Secrets: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY (an R2 API token with read and
# write on both buckets), REVALIDATE_SECRET (as on the site), SANITY_WRITE_TOKEN (an Editor token
# for the site's Sanity project; without it the tournaments aren't added to the Studio). Variables:
# SITE_URL (e.g. https://example.com), R2_RAW_BUCKET (default elo-raw), R2_DATA_BUCKET (default
# elo-data), SANITY_PROJECT_ID (as NEXT_PUBLIC_SANITY_PROJECT_ID on the site).
name: Pipeline

on:
  schedule:
    - cron: "15 1 * * 1-6" # nightly, 01:15 UTC (03:15 Norwegian summer time, 02:15 winter time)
    - cron: "15 1 * * 0" # Sunday: also the whole season's tournament draws
  workflow_dispatch:
    inputs:
      rescan:
        description: "Also rescan the whole season's tournament draws"
        type: boolean
        default: false

concurrency:
  group: pipeline
  cancel-in-progress: false

env:
  RAW: r2:${{ vars.R2_RAW_BUCKET || 'elo-raw' }}
  DATA: r2:${{ vars.R2_DATA_BUCKET || 'elo-data' }}
  RCLONE_CONFIG_R2_TYPE: s3
  RCLONE_CONFIG_R2_PROVIDER: Cloudflare
  RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
  RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
  # rclone in Ubuntu (1.60) checks each upload by its version id, which R2 answers with 501
  RCLONE_CONFIG_R2_NO_HEAD: "true"

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v5

      # No package cache: v5 sets one up for the packageManager in package.json (pnpm), which the
      # pipeline doesn't install, as it needs no packages
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          package-manager-cache: false

      - name: Install rclone
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone

      # The season, and what to fetch tonight. Monday (after the weekend's matches) and manual runs
      # also list the league groups again, sweep every ongoing group, recheck tournament dates and
      # fetch the player register; Wednesday to Friday (and manual runs) check for a new official
      # ranking, which is published once a week then
      - name: Season and schedule
        id: mode
        run: |
          month=$(date -u +%-m); year=$(date -u +%Y); weekday=$(date -u +%u) # 1 Monday … 7 Sunday
          manual=${{ github.event_name == 'workflow_dispatch' }}
          echo "season=$(( month >= 7 ? year : year - 1 ))" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event.schedule }}" = "15 1 * * 0" ] || [ "${{ inputs.rescan }}" = "true" ]; then echo "rescan=true" >> "$GITHUB_OUTPUT"; fi
          if [ "$manual" = "true" ] || [ "$weekday" -eq 1 ]; then echo "weekly=true" >> "$GITHUB_OUTPUT"; fi
          if [ "$manual" = "true" ] || { [ "$weekday" -ge 3 ] && [ "$weekday" -le 5 ]; }; then echo "ranking=true" >> "$GITHUB_OUTPUT"; fi

      # The raw inputs kept from the last run (GitHub's cache; saved again at the end of a run that
      # succeeds), so finished history isn't downloaded again
      - name: Restore raw data
        uses: actions/cache@v4
        with:
          path: |
            pipeline/data/portalen
            pipeline/data/league
            pipeline/data/ranking
            pipeline/data/tournaments
            pipeline/data/upcoming
            pipeline/data/cache
            pipeline/data/players.json
            pipeline/data/clubs.json
            pipeline/data/birth-years.json
            pipeline/data/tournaments.json
            pipeline/data/eliteserien.json
            pipeline/data/eliteserien-*.json
            pipeline/data/build-fingerprint.txt
            pipeline/data/sanity-revisions.json
          key: pipeline-raw-${{ github.run_id }}
          restore-keys: pipeline-raw-

      # The raw inputs (fetched results, rankings, draws, player and club lists, the Eliteserien
      # reviews, which are only recalculated by hand, the fetch caches and the last build's
      # fingerprint): only what's new or changed since the cached copy
      - name: Download raw data
        run: rclone copy "$RAW" data --filter-from ../.github/raw-data.filter --checksum --transfers 32 --checkers 32 --fast-list

      # Only tournaments whose (saved) end date has passed; the weekly run rechecks the dates
      - name: Fetch tournaments (badmintonportalen)
        run: node fetch-portalen.mjs --season ${{ steps.mode.outputs.season }} ${{ steps.mode.outputs.weekly == 'true' && '--check-dates' || '' }}

      # Only groups with a tie dated in the last 14 days that isn't in yet (late results come in);
      # the weekly run lists the groups again and sweeps every ongoing group (postponed ties)
      - name: Fetch league ties
        run: node fetch-league.mjs --season ${{ steps.mode.outputs.season }} ${{ steps.mode.outputs.weekly == 'true' && '--list-groups --all' || '' }}

      # The halls and arranging clubs of ties saved before they were fetched: every saved group once
      # (one request each), then nothing (a group's ties have them from then on)
      - name: Add halls to saved league ties
        run: node fetch-league.mjs --venues

      # The official standings of groups saved before they were fetched: every saved group once (one
      # request each), then nothing (a group fetched from then on brings its standings)
      - name: Add standings to saved league groups
        run: node fetch-league.mjs --standings

      # The golden sets of ties saved before they were fetched (games level, score not): those ties
      # once (one request each), then nothing (a tie fetched from then on brings its golden set)
      - name: Add golden sets to saved league ties
        run: node fetch-league.mjs --golden

      # New players and club changes, and the clubs and their regions (about a minute): weekly
      - name: Fetch the player register and clubs
        if: steps.mode.outputs.weekly == 'true'
        run: node fetch-players.mjs && node fetch-clubs.mjs

      # The birth years of players not seen before (one request each), for the junior rankings and
      # the player pages; after the results and the register, which bring the new players
      - name: Fetch new players' birth years
        run: node fetch-birth-years.mjs

      # The official ranking, published once a week, Wednesday to Friday: one request to check,
      # and the lists (about 20 seconds) only when a new one is out
      - name: Fetch the current ranking
        if: steps.mode.outputs.ranking == 'true'
        run: node fetch-ranking.mjs 200${{ steps.mode.outputs.season }} --if-new

      # Only downloaded here; analysed below if anything is rebuilt. The draws of tournaments being
      # played also give their matches so far, rated until badmintonportalen has the results
      - name: Fetch tournament draws (Cup2000)
        run: node upcoming.mjs --fetch-only ${{ steps.mode.outputs.rescan == 'true' && format('--season {0}', steps.mode.outputs.season) || '' }}

      # full, draws or none (see the top); the fingerprints are saved at the end, after a rebuild
      - name: What to rebuild
        id: build
        run: |
          node fingerprint.mjs > fingerprint.txt
          now() { grep "^$1=" fingerprint.txt | cut -d= -f2; }
          before() { grep "^$1=" data/build-fingerprint.txt 2>/dev/null | cut -d= -f2; }
          weekday=$(date -u +%u) # 1 Monday … 7 Sunday
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$weekday" -ge 6 ] || [ "$weekday" -eq 1 ] || [ "$(now results)" != "$(before results)" ]; then mode=full
          elif [ "$(now draws)" != "$(before draws)" ]; then mode=draws
          else mode=none; fi
          echo "Rebuild: $mode (results $(before results) -> $(now results), draws $(before draws) -> $(now draws))"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          # The Eliteserien steps: in a full rebuild, when its ties or scripts changed or its file is missing
          if [ "$mode" = "full" ] && { [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(now eliteserien)" != "$(before eliteserien)" ] || [ ! -f data/eliteserien.json ]; }; then eliteserien=true; else eliteserien=false; fi
          echo "Eliteserien: $eliteserien"
          echo "eliteserien=$eliteserien" >> "$GITHUB_OUTPUT"
          # A run that uploaded but didn't finish refreshing the site left this (see "Refresh the site")
          if [ -f data/refresh-pending ]; then echo "Last run's refresh didn't finish: refreshing everything"; echo "pending=true" >> "$GITHUB_OUTPUT"; fi

      - name: Rate
        if: steps.build.outputs.mode != 'none'
        run: node rate.mjs > /dev/null

      - name: Gender gap
        if: steps.build.outputs.mode == 'full'
        run: node gender-gap.mjs

      # Team strengths and the season so far with its forecast (after each day played; eliteserien-forecast.mjs)
      - name: Eliteserien team strengths and forecast
        if: steps.build.outputs.eliteserien == 'true'
        run: node eliteserien.mjs > /dev/null

      # What if a tie were 10 matches: this season's teams in a format with 2 more men's matches
      - name: Eliteserien with 10 matches a tie
        if: steps.build.outputs.eliteserien == 'true'
        run: node eliteserien-ten-matches.mjs > /dev/null

      # The earlier seasons in review, from the ratings at the time: done again with the ratings, so
      # they follow any change in how ratings are calculated
      - name: Eliteserien seasons in review
        if: steps.build.outputs.eliteserien == 'true'
        run: node eliteserien-review.mjs > /dev/null

      # Every league team match with its matches' win chances and upsets, from the ratings
      - name: Team matches
        if: steps.build.outputs.mode == 'full'
        run: node team-matches.mjs > /dev/null

      - name: Tournament draws
        if: steps.build.outputs.mode != 'none'
        run: node upcoming.mjs --offline

      - name: Export the web data
        if: steps.build.outputs.mode != 'none'
        run: node export.mjs

      - name: Upload raw data
        if: steps.build.outputs.mode != 'none'
        run: rclone copy data "$RAW" --filter-from ../.github/raw-data.filter --checksum --transfers 32 --checkers 32 --fast-list

      # --checksum: only files whose content changed are uploaded (R2 counts every write). A draws
      # rebuild uploads only the tournaments, so the day's small changes in every player's rating
      # history (decay, players dropping out of the ranking) wait for the next full rebuild. The log
      # (JSON, one line per file) says which files were uploaded or deleted, for the refresh below.
      # Kept in the raw bucket until the site is refreshed: if the refresh fails after the upload, the
      # next run can't tell from its own upload which files changed, so it refreshes everything
      - name: Mark the refresh as pending
        if: steps.build.outputs.mode != 'none' && vars.SITE_URL != ''
        run: touch data/refresh-pending && rclone copyto data/refresh-pending "$RAW/refresh-pending"

      - name: Upload the web data
        if: steps.build.outputs.mode != 'none'
        run: |
          log="--use-json-log -v --log-file sync.log"
          if [ "${{ steps.build.outputs.mode }}" = "full" ]; then rclone sync export "$DATA" --checksum --transfers 32 --checkers 32 --fast-list $log
          else rclone sync export/tournaments "$DATA/tournaments" --checksum --transfers 32 --checkers 32 --fast-list $log; fi

      # Only the pages reading a file just uploaded or deleted (refresh-site.mjs): every page refreshed
      # is an ISR write when next visited, and crawlers visit nearly all of them, so old team matches,
      # finished tournaments and players whose data didn't change stay cached. Without the upload log,
      # or after a run whose refresh failed (the pending mark), everything; also on a night with
      # nothing new. Fails unless the site answers that it revalidated (a redirect, elodrop.no ->
      # www.elodrop.no, is followed with the header kept); the mark then stays for the next run.
      - name: Refresh the site
        if: (steps.build.outputs.mode != 'none' || steps.build.outputs.pending == 'true') && vars.SITE_URL != ''
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ "${{ steps.build.outputs.pending }}" = "true" ]; then node refresh-site.mjs --all
          else node refresh-site.mjs --log sync.log ${{ steps.build.outputs.mode == 'draws' && '--prefix tournaments/' || '' }}; fi
          rm -f data/refresh-pending
          rclone deletefile "$RAW/refresh-pending" || echo "Couldn't remove the pending mark: the next run refreshes everything"

      # What changed in the Studio since the last check (sanity-revisions.mjs), every night whatever was
      # rebuilt, once per change: the clubs (on nearly every page), the badges (every player page) and
      # the halls (tournament and team match pages), which the Sanity webhook leaves to this
      # (web/app/api/revalidate/route.ts), and each tournament changed (only its own pages: the webhook
      # refreshed them at once, so this only matters when its call didn't arrive). The first run only
      # remembers the state. The state is kept only once the site is refreshed, so a failure is tried
      # again the next night; Sanity or the site being down doesn't fail the run.
      - name: Refresh what changed in the Studio
        if: vars.SITE_URL != '' && vars.SANITY_PROJECT_ID != ''
        continue-on-error: true
        env:
          SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
          SANITY_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          tags=$(node sanity-revisions.mjs data/sanity-revisions.json sanity-revisions.json)
          if [ -n "$tags" ]; then echo "Changed in the Studio: $tags"; node refresh-site.mjs --tags $tags; fi
          cp sanity-revisions.json data/sanity-revisions.json && rclone copyto data/sanity-revisions.json "$RAW/sanity-revisions.json"

      # This season's tournaments to the Studio, for checking their organiser and hall
      # (web/scripts/import-tournaments.mts: plain Node, no packages). Sanity being down doesn't fail
      # the run (the next night tries again), but it shows as a warning on the run, as does a
      # missing token, so tournaments don't silently stay out of the Studio.
      - name: Add the tournaments to Sanity
        if: steps.build.outputs.mode != 'none'
        working-directory: web
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
          SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
          DATA_DIR: ../pipeline/export
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/import-tournaments.mts || echo "::warning title=Tournaments not added to Sanity::The import failed (see the step's log); the next night tries again"

      # Last, so a failed rebuild is tried again the next night
      - name: Save the fingerprint
        if: steps.build.outputs.mode != 'none'
        run: cp fingerprint.txt data/build-fingerprint.txt && rclone copyto data/build-fingerprint.txt "$RAW/build-fingerprint.txt"
