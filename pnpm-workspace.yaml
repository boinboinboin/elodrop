packages:
  - web
# Packages whose install scripts may run (pnpm 11+): none. sharp and unrs-resolver use their
# prebuilt binaries, and esbuild's script only checks its binary, as it was skipped before pnpm 11 too.
allowBuilds:
  esbuild: false
  sharp: false
  unrs-resolver: false
# web's `typescript` is the TypeScript 6 API package (@typescript/typescript6, for Next.js and
# typescript-eslint; `tsc` is TypeScript 7). Its package says 6.0.2 though it ships the 6.0.3
# compiler, so this one package's "^6.0.3 || ^7" peer is met in fact.
peerDependencyRules:
  allowedVersions:
    '@sanity/workflow-blueprint>typescript': '6'
overrides:
  '@vercel/frameworks>js-yaml': ^3.15.2
  '@vercel/frameworks>smol-toml': ^1.9.1
  'typeid-js>uuid': ^11.1.1
  '@module-federation/dts-plugin>undici': ^7.30.1
